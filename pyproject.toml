[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entsec-threat-modeling"
version = "0.1.0"
description = "Enterprise security design review: threat modelling for the systems other teams want to build, buy or connect."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Angel De Leon" }]
keywords = ["security", "threat-modeling", "design-review", "grc", "risk-assessment", "third-party-risk", "nist-csf", "iso27001", "soc2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "types-PyYAML"]

[project.scripts]
entsec = "entsec.cli:main"

[project.urls]
Homepage = "https://github.com/angeldeleon/entsec-threat-modeling"
Issues = "https://github.com/angeldeleon/entsec-threat-modeling/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/entsec"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "S", "SIM", "RUF", "PTH"]
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests assert raw mode bits and simulate attacker-owned files on purpose.
"tests/*" = ["S", "SLF001", "PTH"]
"src/entsec/cli.py" = ["SLF001"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
ignore_missing_imports = true

# PyYAML ships type information via the separate types-PyYAML package, which is
# a dev dependency. Resolving it depends on which site-packages mypy is invoked
# from, and that differs between a venv, a system install and the CI image --
# so the check fails for reasons that have nothing to do with the code. The
# module is used for exactly one call (yaml.safe_load) whose signature is not in
# doubt.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["import-untyped"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
