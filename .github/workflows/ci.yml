name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/entsec

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: bandit -q -r src/entsec -c pyproject.toml
      # `.` not the editable install: pip-audit --strict cannot resolve an
      # editable install of the project itself on PyPI and exits 1.
      - run: pip-audit --strict --desc on .

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest

  invariants:
    name: review invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Framework references are complete and well formed
        # These reach GRC trackers and audit conversations, where somebody
        # looks them up. A blank or malformed identifier is worse than none.
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, sys
          from entsec.controls.catalog import BUILTIN_CONTROLS
          expected = {"NIST CSF 2.0", "ISO 27001:2022", "SOC 2 TSC", "CIS v8"}
          patterns = {
              "NIST CSF 2.0": re.compile(r"^(GV|ID|PR|DE|RS|RC)\.[A-Z]{2}$"),
              "ISO 27001:2022": re.compile(r"^A\.[5-8]\.\d{1,2}$"),
              "SOC 2 TSC": re.compile(r"^(CC[1-9]\.\d|[ACP]\d?\d?\.\d|PI\d\.\d)$"),
              "CIS v8": re.compile(r"^Control (1[0-8]|[1-9])$"),
          }
          for entry in BUILTIN_CONTROLS:
              names = {f.name for f in entry.frameworks}
              if names != expected:
                  sys.exit(f"{entry.id} maps to {names}, expected all four")
              for f in entry.frameworks:
                  if not patterns[f.name].match(f.identifier):
                      sys.exit(f"{entry.id}: malformed {f.name} identifier {f.identifier!r}")
          print(f"{len(BUILTIN_CONTROLS)} controls, all four frameworks, all identifiers well formed")
          PY

      - name: The decision is never read from model output
        run: |
          set -euo pipefail
          if grep -rn 'raw.get("decision")\|raw\[.decision.\]\|get("severity")\|get("blocks_decision")' src/entsec/; then
            echo "::error::a model-supplied decision, severity or blocking flag is being read"
            exit 1
          fi
          python - <<'PY'
          import sys
          from entsec.controls.evaluate import decide, evaluate
          from entsec.intake import parse_intake
          from entsec.models import Question
          from entsec.review import _merge_questions
          intake = parse_intake({"system": "S", "users": ["public"],
                                 "data_classes": ["personal data"], "internet_facing": "yes"})
          gaps, questions, _, _ = evaluate(intake)
          first, _ = decide(gaps, questions, [])
          second, _ = decide(gaps, questions, [])
          if first is not second:
              sys.exit("the decision is not reproducible")
          if first.value != "changes_required":
              sys.exit(f"expected changes_required for a blocking design, got {first.value}")
          # A blocking question is what turns an approval into
          # insufficient-information and what makes the exit code 1, so nothing
          # arriving from the analysis layer may set one.
          merged = _merge_questions([], [Question(text="q", blocks_decision=True, trusted=False)])
          if any(q.blocks_decision for q in merged):
              sys.exit("a question from the analysis layer was allowed to block the decision")
          print(f"decision computed and reproducible: {first.value}")
          PY

      - name: Nothing credential-shaped leaves the boundary
        # The README says credential shapes are redacted before anything is
        # sent. A free-text answer, a bare integration entry and the attached
        # document have each broken that claim, and each was one missing call.
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from entsec.analyze.prompt import build_user_message
          from entsec.controls.evaluate import evaluate
          from entsec.intake import parse_intake, scrub_intake
          from entsec.report import render_html, render_json, render_markdown
          from entsec.review import check
          secrets = ["AKIAIOSFODNN7EXAMPLE", "hunter2", "ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
          intake = parse_intake({
              "system": "S",
              "requesting_team": "IT",
              "users": ["employees"],
              "data_classes": ["internal", "biometric AKIAIOSFODNN7EXAMPLE"],
              "privileged_roles": "svc key AKIA​IOSFODNN7EXAMPLE",
              "network_notes": "db at postgres://svc:hunter2@db.internal:5432/app",
              "integrations": ["postgres://svc:hunter2@db.internal:5432/app"],
          })
          intake.document_lines = ["CI: token ghp_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
          scrub_intake(intake)
          gaps, _, applicable, _ = evaluate(intake)
          result = check(intake)
          sinks = {
              "API payload": build_user_message(intake, gaps, applicable),
              "markdown report": render_markdown(result),
              "json report": render_json(result),
              "html report": render_html(result),
          }
          for name, text in sinks.items():
              for secret in secrets:
                  if secret in text:
                      sys.exit(f"{secret!r} reached the {name}")
          print(f"no credential shape reached any of: {', '.join(sinks)}")
          PY

      - name: Unknown is never treated as absent
        # The failure mode that ends adoption: accusing a team of something
        # they were never asked about.
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from entsec.controls.evaluate import evaluate
          from entsec.intake import parse_intake
          base = {"system": "S", "users": ["employees"], "data_classes": ["internal"]}
          blank = parse_intake(base)
          gaps, questions, _, _ = evaluate(blank)
          if [g for g in gaps if g.control_id == "IAM-02"]:
              sys.exit("an unanswered MFA question produced a GAP instead of a question")
          if not any("Multi-factor" in q.text for q in questions):
              sys.exit("an unanswered MFA question produced neither a gap nor a question")
          explicit = parse_intake({**base, "mfa": "no"})
          if not [g for g in evaluate(explicit)[0] if g.control_id == "IAM-02"]:
              sys.exit("an explicit 'no' did NOT produce a gap")
          print("blank is a question, explicit no is a gap")
          PY

      - name: The gate rejects invented facts and control ids
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from entsec.analyze import gate
          from entsec.intake import parse_intake
          intake = parse_intake({"system": "S", "users": ["employees"]})
          for bad, label in (
              ({"title": "x", "chain": ["a"], "fact_ids": ["nope"], "control_ids": ["IAM-01"]}, "fact"),
              ({"title": "x", "chain": ["a"], "fact_ids": ["system"], "control_ids": ["ZZZ-99"]}, "control id"),
          ):
              kept, rejected = gate.apply([bad], intake)
              if kept or not rejected:
                  sys.exit(f"the gate let an invented {label} through")
          print("gate rejects invented facts and control ids")
          PY

      - name: Every file the tool opens refuses a symlink and a FIFO
        # The intake, the config, the attached document, the review that gets
        # written and the baseline database are all read or written where
        # somebody else can also write. Every os.open in the tree carries
        # O_NOFOLLOW, and every read carries O_NONBLOCK as well, so a planted
        # link cannot redirect them and a planted pipe cannot hang the run
        # before the regular-file check.
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for path in pathlib.Path("src/entsec").rglob("*.py"):
              text = path.read_text()
              for match in re.finditer(r"os\.open\((.*?)\)\n", text, re.S):
                  call = match.group(1)
                  if "O_NOFOLLOW" not in call:
                      bad.append(f"{path}: os.open without O_NOFOLLOW")
                  if "O_RDONLY" in call and "O_NONBLOCK" not in call:
                      bad.append(f"{path}: read without O_NONBLOCK")
              if path.name == "validation.py":
                  continue  # defines the guarded reader, and names the call it replaces
              for forbidden in ("read_text(", "write_text("):
                  if forbidden in text:
                      bad.append(f"{path}: {forbidden} bypasses the guarded reader")
          if bad:
              sys.exit("\n".join(bad))
          print("every open is guarded")
          PY

      - name: The API host guard fails closed
        # allow_internal exists for a self-hosted gateway. Everything else must
        # be globally routable unicast, and anything unclassifiable is refused
        # rather than skipped.
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from entsec import httpclient
          from entsec.validation import ValidationError
          cases = {
              "loopback": "127.0.0.1",
              "rfc1918": "10.1.2.3",
              "link-local": "169.254.169.254",
              "ipv4-mapped": "::ffff:169.254.169.254",
              "6to4": "2002:a9fe:a9fe::",
              "nat64": "64:ff9b::a9fe:a9fe",
              "cgnat": "100.64.1.1",
              "scoped link-local": "fe80::1%eth0",
              "unparseable": "not-an-address",
          }
          for label, address in cases.items():
              httpclient.socket.getaddrinfo = lambda *a, _addr=address, **k: [(0, 0, 0, "", (_addr, 443))]
              try:
                  httpclient.assert_api_url("https://gateway.example/v1")
              except ValidationError:
                  continue
              sys.exit(f"{label} ({address}) was accepted as a public API host")
          httpclient.socket.getaddrinfo = lambda *a, **k: [(0, 0, 0, "", ("93.184.216.34", 443))]
          httpclient.assert_api_url("https://api.example.com/v1")
          print(f"all {len(cases)} non-public spellings refused, a public host still allowed")
          PY

      - name: check runs with no API key
        run: |
          set -euo pipefail
          env -u ANTHROPIC_API_KEY entsec check -i intake.example.yml -o /dev/null && rc=0 || rc=$?
          test "$rc" -eq 1 || { echo "expected exit 1 for a blocking example, got $rc"; exit 1; }
          echo "check works with no key and fails a blocking design"

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: The example intake produces the expected decision
        run: |
          set -euo pipefail
          entsec check -i intake.example.yml -o review.md || true
          grep -q "Changes required" review.md
          grep -q "TPR-02" review.md
          # `grep -qv PATTERN` was here, and it can never fail: -v inverts per
          # line, so it exits 0 as long as ONE line lacks the pattern. The
          # invariant it was meant to hold -- that prose written in this
          # repository is not escaped as though a requester had typed it -- was
          # unguarded for as long as it was written that way, and the report
          # was in fact printing "finding\(s\)" at the reader.
          if grep -q '\\(' review.md; then
            echo "::error::tool-authored prose was escaped; see report._prose"
            grep -n '\\(' review.md
            exit 1
          fi
          echo "example review renders correctly"

      - name: An empty intake exits 2, not 0
        run: |
          set -euo pipefail
          printf 'system: ""\n' > empty.yml
          entsec check -i empty.yml -o /dev/null && rc=0 || rc=$?
          test "$rc" -eq 2 || { echo "expected exit 2 for an empty intake, got $rc"; exit 1; }
          echo "an unfilled form fails loudly"

      - name: A clean design is approved
        run: |
          set -euo pipefail
          cat > clean.yml <<'YML'
          system: Internal Runbook Wiki
          requesting_team: Platform Engineering
          owner: Dana Okafor
          stage: design
          data_classes: [internal]
          users: [employees]
          hosting: cloud
          sso: yes
          mfa: yes
          internet_facing: no
          privileged_roles: Four named platform engineers, reviewed quarterly.
          offboarding: Standard leaver process through Okta deprovisioning.
          logging: Sign-ins, edits, permission changes and admin actions.
          network_notes: Corporate VPN only, from managed devices.
          YML
          entsec check -i clean.yml -o clean.md && rc=0 || rc=$?
          test "$rc" -eq 0 || { echo "expected exit 0 for a clean design, got $rc"; exit 1; }
          grep -q "Approved" clean.md
          echo "a clean design is approved and exits 0"
